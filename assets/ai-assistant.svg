<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Always Booked AI assistant">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#16325c"/>
      <stop offset="100%" stop-color="#050a18"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d6ecfb"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="60" fill="url(#bg)"/>
  <!-- antenna -->
  <line x1="60" y1="22" x2="60" y2="32" stroke="#00d4ff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="60" cy="19" r="5" fill="#00d4ff"/>
  <!-- ears -->
  <rect x="22" y="50" width="8" height="20" rx="4" fill="#00d4ff"/>
  <rect x="90" y="50" width="8" height="20" rx="4" fill="#00d4ff"/>
  <!-- head -->
  <rect x="30" y="32" width="60" height="54" rx="18" fill="url(#face)"/>
  <!-- visor -->
  <rect x="37" y="44" width="46" height="24" rx="12" fill="#050a18"/>
  <!-- eyes -->
  <circle cx="50" cy="56" r="5.5" fill="#00d4ff"/>
  <circle cx="70" cy="56" r="5.5" fill="#00d4ff"/>
  <circle cx="51.5" cy="54.5" r="1.6" fill="#ffffff"/>
  <circle cx="71.5" cy="54.5" r="1.6" fill="#ffffff"/>
  <!-- smile -->
  <path d="M50 75 Q60 82 70 75" stroke="#0077b6" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- chat bubble -->
  <path d="M84 84 h22 a6 6 0 0 1 6 6 v10 a6 6 0 0 1 -6 6 h-12 l-6 6 v-6 h-4 a6 6 0 0 1 -6 -6 v-10 a6 6 0 0 1 6 -6z" fill="#00d4ff"/>
  <circle cx="89" cy="95" r="2" fill="#050a18"/>
  <circle cx="95" cy="95" r="2" fill="#050a18"/>
  <circle cx="101" cy="95" r="2" fill="#050a18"/>
</svg>